<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naruto RPG Clash</title>
<style>html,body{margin:0;height:100%;background:#0b0818;color:#ffe9b0;font-family:sans-serif;display:flex;align-items:center;justify-content:center}</style>
</head><body><div id="m">Carregando a versão mais recente do jogo…</div>
<script>
// pergunta a versao atual SEM cache e abre a pasta dessa versao (url unica = nunca versao velha)
fetch('build.json?t=' + Date.now(), {cache: 'no-store'}).then(r => r.json()).then(j => {
  const q = location.search ? location.search : '';
  location.replace('g/' + j.v + '/index.html' + q);
}).catch(() => { document.getElementById('m').textContent = 'Não consegui carregar. Recarregue a página.'; });
</script></body></html>
